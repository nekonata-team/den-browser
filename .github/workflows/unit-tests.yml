name: Unit tests

on:
  pull_request:

concurrency:
  group: unit-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Check for Swift build changes
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check the PR merge diff
        id: filter
        run: |
          files=$(git diff --name-only --no-renames HEAD^1 HEAD -- \
            'Den Browser/' 'Packages/' 'scripts/embedded-js/' \
            'justfile' '*.just' 'mise.toml' \
            '.github/workflows/unit-tests.yml' '.github/workflows/resolve-swift-packages.yml')
          if [[ -n "$files" ]]; then
            echo 'swift=true' >> "$GITHUB_OUTPUT"
          else
            echo 'swift=false' >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    name: Unit tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.swift != 'false' }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      MISE_ENABLE_TOOLS: bun,just
      MISE_NO_HOOKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Swift dependencies
        id: swift-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &swift-dependency-paths |
            ~/Library/Caches/org.swift.swiftpm/repositories
            ~/Library/Caches/org.swift.swiftpm/artifacts
            .derived-data/SourcePackages
          key: swift-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Package.resolved', 'Packages/**/Package.swift', 'Den Browser/Den Browser.xcodeproj/project.pbxproj') }}

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: false

      - name: Run six WebKit tests serially
        id: tests
        run: |
          xcodebuild test \
            -project 'Den Browser/Den Browser.xcodeproj' \
            -scheme 'Den Browser UnitTests' \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derived-data \
            -resultBundlePath .derived-data/TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            '-only-testing:Den BrowserTests/SheetWebRuntimeTests/boardRuntimeObservesUrlAndTitleChanges()' \
            '-only-testing:Den BrowserTests/SheetWebRuntimeTests/boardRuntimeFindsPageFavicon()' \
            '-only-testing:Den BrowserTests/SheetURLPolicyTests/boardRuntimeLoadsLocalHTMLAndSiblingScript()' \
            '-only-testing:Den BrowserTests/DenAPIIntegrationTests/cliSettingsInjectBeforePageScriptsFocusBoardsAndRestoreFromDisk()' \
            '-only-testing:Den BrowserTests/BackgroundExecutionTests/hiddenPageReceivesClickButOnlyRendersWithBackgroundExecution()' \
            '-only-testing:Den BrowserTests/DenMCPResponseTests/toolsUseLiveDenStateThroughStdioAndIPC()'

      - name: Print unit test failure summary
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        run: |
          if [[ -d .derived-data/TestResults.xcresult ]]; then
            just test results
          fi

      - name: Save Swift dependencies
        if: ${{ !cancelled() && steps.swift-cache.outputs.cache-hit != 'true' && hashFiles('.derived-data/SourcePackages/workspace-state.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *swift-dependency-paths
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
