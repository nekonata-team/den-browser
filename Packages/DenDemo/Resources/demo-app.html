<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Project Tasks · Next Sprint</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      margin: 0;
      padding: 32px;
      user-select: none;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    .card {
      background: #1a1d27;
      border: 1px solid #2e3547;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 20px;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11px;
      background: #3b82f6;
      color: #fff;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #222634;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    .task-item.done {
      opacity: 0.6;
      text-decoration: line-through;
      background: #161922;
    }
    .task-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #10b981;
      cursor: pointer;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
      transition: background 0.2s;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Task Verification <span class="badge">Live Preview</span></h1>
    <div id="item-1" class="task-item">
      <input type="checkbox" id="check-1">
      <label for="check-1">Fix navigation layout regression</label>
    </div>
    <div id="item-2" class="task-item">
      <input type="checkbox" id="check-2">
      <label for="check-2">Verify token-efficient semantic tree</label>
    </div>
    <button class="btn" id="btn-save" onclick="this.textContent = 'Verified ✓'; this.style.background = '#10b981';">Verify All Tasks</button>
  </div>
  <script>
    document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', (e) => {
        e.target.closest('.task-item').classList.toggle('done', e.target.checked);
      });
    });
  </script>
</body>
</html>
