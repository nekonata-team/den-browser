id: model-no-operation-exposure
valid:
  - "public final class Model { private let creation: BoardCreation }"
  - "public final class Model { public init(creation: BoardCreation) {} }"
  - "public func submit() { let target: BoardCreation.Target = currentTarget() }"
  - "public extension Model { private var creation: BoardCreation { storedCreation } }"
  - "public var board: BoardState { currentBoard }"
invalid:
  - "public let creation: BoardCreation"
  - "public var removal: BoardRemoval { storedRemoval }"
  - "public func writer() -> DenStateWriter { storedWriter }"
  - "public func submit(notify: (BoardCreation.Notice) -> Void) {}"
  - "public typealias Removal = BoardRemoval"
  - "public extension Model { var movement: BoardMovement { storedMovement } }"
  - "public let operations = NotificationOperations(state: state, writer: writer)"
  - "public private(set) var creation: BoardCreation"
  - "public class Model { public subscript(index: Int) -> BoardRemoval { operations[index] } }"
