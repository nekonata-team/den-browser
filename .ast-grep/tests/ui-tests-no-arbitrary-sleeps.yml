id: ui-tests-no-arbitrary-sleeps
valid:
  - 'assertEventually(timeout: 5) { element.exists }'
  - 'assertValue(of: field, equals: "expected")'
  - 'let text = "Thread.sleep(forTimeInterval: 0.1)"'
  - '// try await Task.sleep(for: .milliseconds(50))'
  - |
    class UITestCase: XCTestCase {
        private func waitForInputSource(id: String, timeout: TimeInterval = 3) -> Bool {
            Thread.sleep(forTimeInterval: 0.05)
            return true
        }
    }
invalid:
  - 'Thread.sleep(forTimeInterval: 0.1)'
  - 'Foundation.Thread.sleep(forTimeInterval: 0.1)'
  - 'try await Task.sleep(for: .milliseconds(50))'
  - 'try await Swift.Task.sleep(for: .milliseconds(50))'
  - 'try await _Concurrency.Task.sleep(nanoseconds: 1_000_000)'
  - 'sleep(1)'
  - 'usleep(1_000)'
  - 'nanosleep(&req, nil)'
  - 'Darwin.sleep(1)'
  - 'Darwin.usleep(1_000)'
  - 'Darwin.nanosleep(&req, nil)'
  - |
    Thread
        .sleep(forTimeInterval: 0.1)
  - |
    class OtherTestCase: XCTestCase {
        func waitForInputSource(id: String) {
            Thread.sleep(forTimeInterval: 0.05)
        }
    }
  - |
    class UITestCase: XCTestCase {
        func testSomething() {
            Thread.sleep(forTimeInterval: 0.05)
        }
    }
