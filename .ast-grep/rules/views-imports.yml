id: views-imports
language: Swift
severity: error
message: Views may import presentation Models and Domain, plus drawing SDKs and libraries.
files:
  - "Packages/DenViews/Sources/**/*.swift"
rule:
  kind: import_declaration
  has:
    kind: identifier
    not:
      regex: '^(SwiftUI|AppKit|CoreGraphics|Foundation|DenPresentationModels|DenDomain|SFSafeSymbols)(\.|$)'
    stopBy: end
