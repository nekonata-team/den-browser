id: model-imports
language: Swift
severity: error
message: Pure presentation models may use Application and Domain, but not UI or native SDKs.
files:
  - "Packages/DenModels/Sources/DenModels/**/*.swift"
rule:
  kind: import_declaration
  has:
    kind: identifier
    not:
      regex: '^(Foundation|Observation|DenDomain|DenApplication)(\.|$)'
    stopBy: end
