id: domain-no-ui-imports
language: Swift
severity: error
message: Domain must not import UI frameworks or the Terminal runtime SDK.
note: Keep product values and rules here; move UI and runtime integration to Presentation or Infrastructure.
files:
  - "Packages/DenDomain/Sources/DenDomain/**/*.swift"
rule:
  kind: import_declaration
  has:
    kind: identifier
    regex: '^(SwiftUI|AppKit|WebKit|GhosttyTerminal)(\.|$)'
    stopBy: end
