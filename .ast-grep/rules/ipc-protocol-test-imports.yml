id: ipc-protocol-test-imports
language: Swift
severity: error
message: DenIPCProtocol tests must keep the package's dependency boundary; use its module, Testing, and permitted dependencies only.
files:
  - "Packages/DenIPCProtocol/Tests/**/*.swift"
rule:
  kind: import_declaration
  has:
    kind: identifier
    not:
      regex: '^(Foundation|DenIPCProtocol|Testing)(\.|$)'
    stopBy: end
