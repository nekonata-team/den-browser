id: core-no-main-actor
language: Swift
severity: error
message: Domain, Application, Infrastructure, IPC protocol, CLI, and Demo are actor-independent; keep MainActor isolation in Models or App.
files:
  - "Den Browser/den/**/*.swift"
  - "Packages/DenApplication/Sources/**/*.swift"
  - "Packages/DenApplication/Tests/**/*.swift"
  - "Packages/DenDemo/Sources/**/*.swift"
  - "Packages/DenDomain/Sources/**/*.swift"
  - "Packages/DenDomain/Tests/**/*.swift"
  - "Packages/DenIPCProtocol/Sources/**/*.swift"
  - "Packages/DenIPCProtocol/Tests/**/*.swift"
  - "Packages/DenInfrastructure/Sources/**/*.swift"
  - "Packages/DenInfrastructure/Tests/**/*.swift"
rule:
  kind: attribute
  regex: '^@(?:Swift\.)?MainActor\b'
