id: tests-no-standard-user-defaults
language: Swift
severity: error
message: Use makeTestDefaults() (or an in-memory UserDefaults) instead of UserDefaults.standard or UserDefaults(suiteName:) in tests.
files:
  - "Den Browser/Den BrowserTests/**/*.swift"
  - "Den Browser/Den BrowserUITests/**/*.swift"
  - "Packages/*/Tests/**/*.swift"
rule:
  any:
    - pattern: UserDefaults.standard
    - pattern: Foundation.UserDefaults.standard
    - all:
        - any:
            - pattern: UserDefaults($$$)
            - pattern: Foundation.UserDefaults($$$)
        - not:
            inside:
              stopBy: end
              any:
                - pattern: 'UserDefaults().removePersistentDomain(forName: $SUITE)'
                - pattern: 'Foundation.UserDefaults().removePersistentDomain(forName: $SUITE)'
