id: views-test-imports
language: Swift
severity: error
message: DenViews tests must keep the package's dependency boundary; use its module, Testing, and permitted dependencies only.
files:
  - "Packages/DenViews/Tests/**/*.swift"
rule:
  kind: import_declaration
  has:
    kind: identifier
    not:
      regex: '^(SwiftUI|AppKit|CoreGraphics|Foundation|DenModels|DenDomain|DenViews|SFSafeSymbols|Testing)(\.|$)'
    stopBy: end
