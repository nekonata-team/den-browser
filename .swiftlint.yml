excluded:
  - .derived-data
  - .derived-data-ui

disabled_rules:
  # swift-format is the source of truth for these style rules.
  - opening_brace
  - trailing_comma
  - closure_parameter_position
  - large_tuple
  - todo

  # Existing UI and test boundaries are intentionally larger than these limits.
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - line_length
  - type_body_length
  - type_name

custom_rules:
  unsafe_sf_symbol:
    name: "Unsafe SF Symbol"
    regex: '\b(?:systemName|systemImage)\s*:'
    message: "Use SFSafeSymbols' typed systemSymbol API."
    severity: error
